<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --black: #050505; --deep: #0a0a0c; --charcoal: #111115; --smoke: #1a1a1f;
    --silver: #a8a49e; --light-silver: #c8c4be; --cream: #e8e2d8;
    --gold: #b8965a; --gold-light: #d4aa6e; --white: #f5f0ea; --nav-height: 96px;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--black); color: var(--cream); font-family: 'Raleway', sans-serif; font-weight: 300; overflow-x: hidden; cursor: none; }

  /* CURSOR */
  .cursor { position: fixed; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); transition: width .3s, height .3s; mix-blend-mode: difference; }
  .cursor-ring { position: fixed; width: 36px; height: 36px; border: 1px solid rgba(184,150,90,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: width .3s, height .3s, left .06s, top .06s; }

  /* NAV */
  nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height); background: var(--black); border-bottom: 1px solid rgba(184,150,90,0.15); display: flex; align-items: center; justify-content: space-between; padding: 0 4rem; z-index: 1000; transition: background .4s; }
  nav.scrolled { background: rgba(5,5,5,0.97); backdrop-filter: blur(12px); }
  .nav-logo { height: 68px; opacity: 0.95; filter: brightness(1.1) contrast(1.05); transition: opacity .3s; }
  .nav-logo:hover { opacity: 1; }
  .nav-links { display: flex; align-items: center; gap: 3rem; list-style: none; }
  .nav-links a { font-family: 'Cinzel', serif; font-size: .68rem; letter-spacing: .2em; color: var(--silver); text-decoration: none; text-transform: uppercase; transition: color .3s; position: relative; }
  .nav-links a::after { content:''; position: absolute; bottom: -4px; left: 0; right: 0; height: 1px; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .3s; }
  .nav-links a:hover { color: var(--cream); }
  .nav-links a:hover::after { transform: scaleX(1); }
  .nav-links a.active { color: var(--gold); }
  .nav-links a.active::after { transform: scaleX(1); }
  .nav-dropdown { position: relative; }
  .dropdown-menu { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: rgba(8,8,10,0.98); border: 1px solid rgba(184,150,90,0.2); backdrop-filter: blur(20px); padding: 0.5rem 0; min-width: 160px; opacity: 0; pointer-events: none; transition: opacity .25s; margin-top: 0; }
  .dropdown-menu::before { content: ''; position: absolute; top: -12px; left: 0; right: 0; height: 12px; }
  .nav-dropdown:hover .dropdown-menu { opacity: 1; pointer-events: all; }
  .dropdown-menu a { display: block; padding: .7rem 1.5rem; font-family: 'Cinzel', serif; font-size: .62rem; letter-spacing: .15em; color: var(--silver); text-decoration: none; transition: color .2s, background .2s; }
  .dropdown-menu a:hover { color: var(--gold-light); background: rgba(184,150,90,0.06); }
  .dropdown-menu a.active { color: var(--gold); }
  .dropdown-menu a::after { display: none; }
  .nav-dropdown > a::before { content: '▾'; margin-left: .4rem; font-size: .6rem; color: var(--gold); }
  .nav-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
  .nav-hamburger span { width: 24px; height: 1px; background: var(--silver); transition: all .3s; }

  /* PAGE HEADER */
  .page-header { padding-top: var(--nav-height); background: var(--deep); border-bottom: 1px solid rgba(184,150,90,.1); }
  .page-header-inner { padding: 4rem 6rem 3.5rem; }
  .section-label { font-family: 'Cinzel', serif; font-size: .62rem; letter-spacing: .4em; color: var(--gold); text-transform: uppercase; margin-bottom: 1rem; display: block; }
  .page-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem,4vw,3.8rem); font-weight: 300; color: var(--white); line-height: 1.1; margin-bottom: 1.5rem; }
  .gold-line { width: 80px; height: 1px; background: linear-gradient(to right, var(--gold), transparent); }
  .page-count { font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .3em; color: var(--silver); text-transform: uppercase; margin-top: 1.2rem; }

  /* GALLERY GRID */
  .gallery-section { background: var(--deep); padding: 3px 0 6rem; }
  .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .gallery-grid-item { position: relative; overflow: hidden; aspect-ratio: 4/5; cursor: pointer; }
  .gallery-grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.16,1,.3,1), filter .5s; filter: brightness(.82) saturate(.85); }
  .gallery-grid-item:hover img { transform: scale(1.06); filter: brightness(1) saturate(1); }
  .gallery-grid-item-overlay { position: absolute; inset: 0; background: rgba(5,5,5,.45); opacity: 0; transition: opacity .4s; display: flex; align-items: center; justify-content: center; }
  .gallery-grid-item:hover .gallery-grid-item-overlay { opacity: 1; }
  .gallery-zoom-icon { width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.4rem; transform: scale(.7); transition: transform .3s; }
  .gallery-grid-item:hover .gallery-zoom-icon { transform: scale(1); }

  /* LIGHTBOX */
  .lightbox { position: fixed; inset: 0; background: rgba(3,3,3,.97); z-index: 9000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .lightbox.open { opacity: 1; pointer-events: all; }
  .lightbox img { max-width: 90vw; max-height: 88vh; object-fit: contain; transform: scale(.95); transition: transform .4s cubic-bezier(.16,1,.3,1); }
  .lightbox.open img { transform: scale(1); }
  .lightbox-close { position: absolute; top: 2rem; right: 2.5rem; font-family: 'Cinzel', serif; font-size: .7rem; letter-spacing: .3em; color: var(--silver); cursor: pointer; transition: color .3s; text-transform: uppercase; }
  .lightbox-close:hover { color: var(--gold); }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 2rem; color: var(--silver); cursor: pointer; padding: 1.5rem; transition: color .3s; user-select: none; }
  .lightbox-nav:hover { color: var(--gold); }
  .lightbox-prev { left: 1rem; }
  .lightbox-next { right: 1rem; }

  /* FOOTER */
  footer { background: var(--black); border-top: 1px solid rgba(184,150,90,.1); padding: 3rem 6rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2rem; }
  .footer-logo img { height: 52px; opacity: .7; filter: brightness(1.1); }
  .footer-center p { font-family: 'Cinzel', serif; font-size: .55rem; letter-spacing: .3em; color: rgba(168,164,158,.4); text-transform: uppercase; text-align: center; }
  .footer-links { display: flex; gap: 2rem; justify-content: flex-end; }
  .footer-links a { font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .2em; color: rgba(168,164,158,.5); text-decoration: none; text-transform: uppercase; transition: color .3s; }
  .footer-links a:hover { color: var(--gold); }

  /* GRAIN */
  body::after { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9990; opacity: .4; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    nav { padding: 0 1.5rem; height: 72px; background: #050505 !important; }
    :root { --nav-height: 72px; }
    .nav-logo { height: 52px; }
    .nav-links { display: none; }
    .nav-links.open {
      display: flex; flex-direction: column;
      position: fixed; top: 72px; left: 0; right: 0; bottom: 0;
      background: #050505;
      padding: 2.5rem 2rem;
      z-index: 999;
      gap: 0;
      overflow-y: auto;
      border-top: 1px solid rgba(184,150,90,.15);
    }
    .nav-links.open li { list-style: none; border-bottom: 1px solid rgba(184,150,90,.08); padding: 1rem 0; }
    .nav-links.open li a { font-size: .75rem; letter-spacing: .25em; color: var(--cream); }
    .nav-links.open li a::before { display: none; }
    .nav-hamburger { display: flex; }
    .dropdown-menu {
      position: static !important; opacity: 1 !important; pointer-events: all !important;
      border: none !important; background: transparent !important;
      padding: 0.75rem 0 0 1.2rem !important; transform: none !important;
      min-width: unset !important; display: flex !important; flex-direction: column; gap: 0.1rem;
    }
    .dropdown-menu a { padding: .45rem 0 !important; font-size: .65rem !important; color: var(--silver) !important; letter-spacing: .2em; }
    .nav-dropdown > a::before { content: ''; }
    .page-header-inner { padding: 2.5rem 1.5rem 2rem; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    footer { grid-template-columns: 1fr; text-align: center; gap: 1.5rem; padding: 2.5rem 1.5rem; }
    .footer-links { justify-content: center; }
  }
  @media (max-width: 480px) {
    .gallery-grid { grid-template-columns: 1fr; }
  }
</style>

function openLightbox(index) {
  currentIndex = index;
  document.getElementById('lightbox-img').src = images[currentIndex];
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function closeLightboxOnBg(e) { if (e.target === document.getElementById('lightbox')) closeLightbox(); }
function lightboxNav(dir) {
  currentIndex = (currentIndex + dir + images.length) % images.length;
  document.getElementById('lightbox-img').src = images[currentIndex];
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') lightboxNav(1);
  if (e.key === 'ArrowLeft') lightboxNav(-1);
